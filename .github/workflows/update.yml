name: Update

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31

      - name: Update flake inputs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%u)" = "1" ]; then
            nix flake update
          fi

      # Plain script instead of nix-update: nix-update's flake mode fails on
      # recent Nix ("opening file /nix/store/...-source: No such file")
      - name: Update Jackify
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          old=$(sed -nE 's/^  version = "([^"]+)";$/\1/p' package.nix)
          tag=$(gh api repos/Omni-guides/Jackify/releases/latest --jq .tag_name)
          new=${tag#v}
          if [ "$old" != "$new" ]; then
            url="https://github.com/Omni-guides/Jackify/releases/download/$tag/Jackify.AppImage"
            hash=$(nix store prefetch-file --json "$url" | jq -r .hash)
            sed -i -E "s|^  version = \"[^\"]+\";$|  version = \"$new\";|" package.nix
            sed -i -E "s|^    hash = \"sha256-[^\"]+\";$|    hash = \"$hash\";|" package.nix
          fi
          if [ "$old" != "$new" ]; then
            title="jackify: $old -> $new"
            body="Changelog: https://github.com/Omni-guides/Jackify/releases/tag/v$new"
          else
            title="flake.lock: update"
            body="Only flake inputs changed."
          fi
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "body=$body" >> "$GITHUB_OUTPUT"

      # Fails if the AppRun patch no longer applies (--replace-fail),
      # so a broken update never reaches a PR
      - name: Build
        run: nix build .#jackify -L

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: auto-update
          delete-branch: true
          commit-message: ${{ steps.update.outputs.title }}
          title: ${{ steps.update.outputs.title }}
          body: ${{ steps.update.outputs.body }}